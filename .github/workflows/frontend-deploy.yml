# 프론트 빌드·배포 (I-11, 할 일 15). PR에서는 검사·빌드만, dev 브랜치에 합치면 dev 버킷, main에 합치면 prod 버킷에 올린다.
# 흐름: lint → test → build(main만 VITE_COGNITO_* 주입) → S3 sync → CloudFront 무효화 → https://<id>.cloudfront.net
# BFF(10/29): dev는 gateway가 로그인을 맡아 Cognito 값을 넣지 않는다(DEV_COGNITO_* 변수 지움). Amplify 코드가 남아 있는 동안 dev 화면은 가짜(mock) 로그인이다.
# main(prod)은 경우님 BFF 프론트가 릴리스될 때까지 PROD_COGNITO_*를 그대로 넣는다. 그때 아래 COGNITO 줄을 모두 지운다.
# 값은 레포 Variables에 둔다(비밀이 아니다. User Pool ID·Client ID는 어차피 빌드 결과에 들어간다). 환경마다 앞에 DEV_·PROD_가 붙는다.
#   <ENV>_COGNITO_USER_POOL_ID, <ENV>_COGNITO_CLIENT_ID, <ENV>_FRONTEND_BUCKET, <ENV>_FRONTEND_DISTRIBUTION_ID, <ENV>_FRONTEND_DEPLOY_ROLE_ARN
#   (infra envs/<env>/persistent output. infra scripts/set-github-values.ps1 -Env <env>이 넣는다. infra README 4-8·4-12)
# prod는 Cognito가 dev와 달라 빌드 결과도 다르다(같은 코드를 prod 값으로 다시 빌드한다).
name: frontend-deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # GitHub OIDC로 배포 Role을 맡는다 (장기 AWS 키 없음)

# 토스 결제위젯 클라이언트 키(test_gck_...). 공개돼도 되는 값이라 레포 Variables에 둔다(DEV_TOSS_CLIENT_KEY, PROD_TOSS_CLIENT_KEY).
# infra scripts/set-toss-key.ps1이 Secrets Manager에 키를 넣으면서 같이 넣는다. 시크릿 키(gsk)는 여기 두지 않는다(order-service만 쓴다)
# 없어도 빌드·배포는 된다(결제 화면만 동작하지 않는다). main 배포만 PROD_ 값을 쓴다
env:
  VITE_TOSS_CLIENT_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_TOSS_CLIENT_KEY || vars.DEV_TOSS_CLIENT_KEY }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' }}
      # main → prod, 그 밖(dev, PR) → dev 값. main으로 가는 PR도 dev 값으로 검사 빌드만 한다
      TARGET: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'PROD' || 'DEV' }}
      COGNITO_USER_POOL_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_COGNITO_USER_POOL_ID || '' }}
      COGNITO_CLIENT_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_COGNITO_CLIENT_ID || '' }}
      FRONTEND_BUCKET: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_FRONTEND_BUCKET || vars.DEV_FRONTEND_BUCKET }}
      FRONTEND_DISTRIBUTION_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_FRONTEND_DISTRIBUTION_ID || vars.DEV_FRONTEND_DISTRIBUTION_ID }}
      FRONTEND_DEPLOY_ROLE_ARN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PROD_FRONTEND_DEPLOY_ROLE_ARN || vars.DEV_FRONTEND_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: build
        run: npm run build
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ env.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT_ID }}

      # main 배포인데 PROD_ 값이 없으면 위 식이 DEV_ 값으로 넘어간다. dev 값으로 만든 화면이 prod 버킷에 올라가지 않게
      # 그 환경 이름이 붙은 Variables를 직접 다시 확인한다.
      - name: 배포 값 확인
        if: env.DEPLOY == 'true'
        env:
          VARS: ${{ toJSON(vars) }}
        run: |
          missing=""
          keys="FRONTEND_BUCKET FRONTEND_DISTRIBUTION_ID FRONTEND_DEPLOY_ROLE_ARN"
          [ "$TARGET" = "PROD" ] && keys="COGNITO_USER_POOL_ID COGNITO_CLIENT_ID $keys"   # dev는 BFF라 Cognito 값이 없다
          for k in $keys; do
            [ -n "$(echo "$VARS" | jq -r --arg k "${TARGET}_${k}" '.[$k] // empty')" ] || missing="$missing ${TARGET}_${k}"
          done
          if [ -n "$missing" ]; then
            # Cognito 값 없이 빌드하면 가짜 로그인 화면이 올라간다. 올리지 않는다
            echo "::error::레포 Variables가 비어 있다:$missing (infra README 4-8·4-12)"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        if: env.DEPLOY == 'true'
        with:
          role-to-assume: ${{ env.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: S3에 올리기
        if: env.DEPLOY == 'true'
        env:
          BUCKET: ${{ env.FRONTEND_BUCKET }}
        run: |
          # 이름에 해시가 붙은 파일(assets/)은 1년 캐시, 나머지(index.html 등)는 매번 새로 확인
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: CloudFront 무효화
        if: env.DEPLOY == 'true'
        env:
          DIST: ${{ env.FRONTEND_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/index.html" "/" \
            --query Invalidation.Id --output text)
          echo "무효화 ${id}"
          url=$(aws cloudfront get-distribution --id "$DIST" --query Distribution.DomainName --output text 2>/dev/null || true)
          echo "### ${TARGET,,} 배포: https://${url:-<CloudFront 주소>} (커밋 ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      # 배포(dev·main push, 수동 실행)일 때만 성공·실패를 알린다. PR 검사는 알리지 않는다.
      # 웹훅은 조직 비밀 DEPLOY_WEBHOOK_URL (.github actions/notify). 없으면 알림만 건너뛴다
      - name: 배포 알림
        if: always() && env.DEPLOY == 'true'
        uses: sesac-freshlink/.github/actions/notify@main
        with:
          webhook-url: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "frontend ${{ env.TARGET == 'PROD' && 'prod' || 'dev' }} 배포"
